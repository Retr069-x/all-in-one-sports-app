name: sportconnect
description: A beginner sports learning and discovery app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  intl: ^0.20.3
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoSansArabic-OFL.txt
    - assets/fonts/NotoSansDevanagari-OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
